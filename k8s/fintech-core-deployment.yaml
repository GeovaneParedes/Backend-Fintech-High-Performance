apiVersion: apps/v1
kind: Deployment
metadata:
  name: fintech-core-api
  namespace: fintech-production
  labels:
    app: fintech-core-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fintech-core-api
  template:
    metadata:
      labels:
        app: fintech-core-api
        tier: backend
    spec:
      containers:
      - name: fintech-core-api
        image: geovaneparedes/fintech-core-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: TefService__BaseUrl
          value: "http://fake-tef-service:5001"
        - name: ConnectionStrings__DefaultConnection
          value: "Data Source=/tmp/fintech.db;Cache=Shared;"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /swagger/index.html
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /swagger/index.html
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fintech-core-service
  namespace: fintech-production
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 8080
    protocol: TCP
  selector:
    app: fintech-core-api
