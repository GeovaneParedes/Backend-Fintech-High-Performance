services:
  fake-tef-api:
    build:
      context: .
      dockerfile: src/FakeTef.Api/Dockerfile
    container_name: fake_tef_api
    ports:
      - "5001:5001"
    environment:
      - ASPNETCORE_URLS=http://+:5001

  fintech-core-api:
    build:
      context: .
      dockerfile: src/FintechCore.Api/Dockerfile
    container_name: fintech_core_api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TefService__BaseUrl=http://fake-tef-api:5001
      - ConnectionStrings__DefaultConnection=Data Source=fintech.db;Cache=Shared;
    depends_on:
      - fake-tef-api
